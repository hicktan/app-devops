name: CI/CD App Devops

on:
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write

jobs:
    job1:
        name: Build ECR
        env:
            IMAGE_TAG: ${{github.sha}}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.0
            
            - name: "Configure AWS Credentials"
              uses: aws-actions/configure-aws-credentials@v5.1.0
              with:
                role-to-assume: arn:aws:iam::023085635104:role/GitHubActionsAppDevops
                aws-region: us-east-1
            
            - name: Amazon ECR "Login" Action for GitHub Actions
              uses: aws-actions/amazon-ecr-login@v2.0.1

            - name: Build, Tag, and Push Docker image to Amazon ECR
              run: |
                # Build a Docker image and tag it
                docker build -t app-devops .

                # Tag the image with the ECR repository URI
                docker tag app-devops:latest 023085635104.dkr.ecr.us-east-1.amazonaws.com/app-devops:latest

                # Push the Docker image to ECR
                docker push 023085635104.dkr.ecr.us-east-1.amazonaws.com/app-devops:latest
        outputs:
            image_tag: ${{ env.IMAGE_TAG }}
            
    job2:
        name: Deploy to EC2
        env:
            INSTANCE_KEY: ${{secrets.INSTANCE_KEY}}
            PUBLIC_IP: ${{secrets.PUBLIC_IP}}
            ECR_REPOSITORY: app-devops
            ECR_URI: 
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: Deploy EC2 SSH
              run: |
                echo "$INSTACE_KEY" > app-devops-chave.pem
                ssh -o StrictHostKeyChecking=no -i app-devops-chave.pem ec2-user@$PUBLIC_IP << EOF 
                    IMAGE_TAG=${{needs.job1.outputs.image_tag}}
                    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 023085635104.dkr.ecr.us-east-1.amazonaws.com
                    docker pull 023085635104.dkr.ecr.us-east-1.amazonaws.com/app-devops:latest
                    docker stop app-devops || true
                    docker rm app-devops || true
                    docker run -d --name $ECR_REPOSITORY -p 80:80 023085635104.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
                >>