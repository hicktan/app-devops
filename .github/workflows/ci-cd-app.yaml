name: CI/CD App Devops

on:
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write

jobs:
    job1:
        name: Build ECR
        env:
            IMAGE_TAG: ${{github.sha}}
            ECR_URI: ${{secrets.ECR_URI}}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.0
            
            - name: "Configure AWS Credentials"
              uses: aws-actions/configure-aws-credentials@v5.1.0
              with:
                role-to-assume: ${{secrets.GITHUBACTIONSAPPDEVOPS}}
                aws-region: us-east-1
            
            - name: Amazon ECR "Login" Action for GitHub Actions
              uses: aws-actions/amazon-ecr-login@v2.0.1

            - name: Build, Tag, and Push Docker image to Amazon ECR
              run: |
                IMAGE_PATH="${ECR_URI}:${IMAGE_TAG}"
                echo "Iniciando build e push para: $IMAGE_PATH"
                docker build -t $IMAGE_PATH -f Dockerfile ./website

                # Push the Docker image to ECR
                docker push $IMAGE_PATH
        outputs:
            image_tag: ${{ env.IMAGE_TAG }}
            ECR_URI: ${{ env.ECR_URI}}
            
    job2:
        name: Deploy to EC2 via SSM
        runs-on: ubuntu-latest
        needs: job1
        env:
            ECR_REPOSITORY: app-devops
            ECR_URI: ${{secrets.ECR_URI}}
            IMAGE_TAG: ${{github.sha}}
            EC2_Tag_Name: app-devops-server
        steps:
            - name: "Configure AWS Credentials"
              uses: aws-actions/configure-aws-credentials@v5.1.0
              with:
                role-to-assume: ${{secrets.GITHUBACTIONSAPPDEVOPS}}
                aws-region: us-east-1

            - name: Find EC2 ID by tag
              id: find_ec2
              run: |
                INSTANCE_ID=$(aws ec2 describe-instances \
                  --filters "Name=tag:Name,Values=$EC2_Tag_Name" "Name=instance-state-name,Values=running" \
                  --query "Reservations[].Instances[].InstanceId[]" \
                  --output text)

                  if [ -z "$INSTANCE_ID" ]; then
                    echo "::error::Nenhuma instância EC2 rodando com o Tag:Name = $EC2_TAG_NAME encontrada."
                    exit 1
                  fi
                  echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
              
            - name: Deploy via SSM
              run: |
                INSTANCE_ID="${{ steps.find_ec2.outputs.instance_id }}"
                COMMAND_ID=$(aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters 'commands=[
                    "echo \"=== Iniciando deploy da imagem ${{ env.IMAGE_TAG }} ===\"",
                    "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.ECR_URI }}",
                    "docker stop ${{ env.ECR_REPOSITORY }} 2>/dev/null || true",
                    "docker rm ${{ env.ECR_REPOSITORY }} 2>/dev/null || true",
                    "docker pull ${{ env.ECR_URI }}:${{ env.IMAGE_TAG }}",
                    "docker run -d --name ${{ env.ECR_REPOSITORY }} -p 80:80 --restart unless-stopped ${{ env.ECR_URI }}:${{ env.IMAGE_TAG }}",
                    "echo \"=== Container iniciado com sucesso ===\"",
                    "docker ps | grep ${{ env.ECR_REPOSITORY }}"
                  ]' \
                  --output text \
                  --query "Command.CommandId")

                echo "📤 Comando SSM enviado: $COMMAND_ID"
                echo "⏳ Aguardando execução..."
                
                aws ssm wait command-executed \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                
                echo "✅ Deploy concluído!"
                
                # Verifica status do comando
                STATUS=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "Status" \
                  --output text)
                
                if [ "$STATUS" != "Success" ]; then
                  echo "::error::Deploy falhou com status: $STATUS"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardErrorContent" \
                    --output text
                  exit 1
                fi

                  